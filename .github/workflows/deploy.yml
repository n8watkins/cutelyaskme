# Deploys main to the Cloudflare Worker (wrangler.jsonc) after CI passes on it.
# Only main deploys: release/* branches (the release-kit train) and pull
# requests never do. Until the CLOUDFLARE_API_TOKEN repository secret exists,
# the job reports that and skips.
#
# NEXT_PUBLIC_* values are inlined by `next build`, so they come from
# repository variables (Settings, Secrets and variables, Actions, Variables).
# They are public: each one ships in the pages. Server secrets stay in Worker
# secrets (`wrangler secret put`), never here.
name: Deploy

on:
  # Safe here: the job runs only for CI runs from pushes to main in this repo
  # (never pull requests or forks) and checks out the commit CI passed on.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.repository == 'n8watkins/cutelyaskme' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      # Cloudflare Web Analytics (src/app/layout.tsx); optional, off when unset.
      NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
      # Browser errors go to Sentry (lib/error-reporting.ts). Only this build
      # sets the DSN, so local, CI and test builds send nothing.
      NEXT_PUBLIC_SENTRY_DSN: https://72ae785933d3a6720db0ad6ea4dd26c1@o4507767562371072.ingest.us.sentry.io/4512375298719745
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add the repository secret to deploy main automatically."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # A build without these would ship a site with sign-in, maps or push
      # turned off, so the deploy stops instead. The Map ID is optional
      # (lib/google-maps.ts falls back to Google's demo map style).
      - name: Check the public build values
        if: steps.token.outputs.present == 'true'
        run: |
          missing=""
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing. Add them under Settings, Secrets and variables, Actions, Variables."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID" ]; then
            echo "::notice::NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID is not set; maps use Google's demo map style."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.token.outputs.present == 'true'

      - name: Build and deploy
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:worker
