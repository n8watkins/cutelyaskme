# CI with lanes (release-kit docs/CI_LANES.md): "What changed" classifies the
# diff, each job runs only in the lanes that need it (a job-level `if:`, never
# a workflow `paths` filter), and "CI result" is the one required check.
# Pushes to main and manual runs always run everything.
# Everything runs on GitHub-hosted runners (free for a public repo). Nothing
# reaches a real service: the end-to-end tests use a throwaway SQLite file,
# placeholder Clerk keys and no email, SMS, push, maps or AI keys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the release train runs it on its release commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run; every push to main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: What changed
    uses: n8watkins/release-kit/.github/workflows/changes.yml@v2.9.0

  # A kit-only update (Dependabot, or a re-run of apply): about a minute.
  kit:
    name: Kit update
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install release-kit verify

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  types:
    name: Types
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Migrations apply to an empty database
        env:
          TURSO_DATABASE_URL: file:${{ runner.temp }}/migrate-check.db
        run: node scripts/migrate.mjs

  # The production build with no secrets at all, then the first-load JS of
  # every page against bundle-budget.json (the table lands in the job summary).
  build:
    name: Build and bundle size
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run size

  # The Cloudflare Worker: generated binding types are current, the OpenNext
  # build succeeds with no secrets, and wrangler bundles the Worker entry
  # (worker/index.ts) without deploying it.
  worker:
    name: Worker build
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Binding types match wrangler.jsonc
        run: npx wrangler types --env-interface CloudflareEnv --strict-vars=false --check cloudflare-env.d.ts
      - run: npm run build:worker
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"

  # Playwright against a production build (`next start`) on a fresh SQLite
  # file, one job per browser engine. Includes the axe accessibility checks.
  # The browser tests run in Playwright's image, which must match the installed
  # Playwright exactly; an upgrade moves CI to its image by itself.
  playwright:
    name: Playwright version
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: End to end (${{ matrix.browser }})
    needs: [changes, playwright]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come with the image, so no job waits
    # on Ubuntu's package mirrors (WebKit's libraries once took 20 minutes).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    env:
      # Browsers refuse a HOME owned by another user (the container runs as root).
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium-desktop --project=chromium-mobile
          - browser: webkit
            projects: --project=webkit-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test ${{ matrix.projects }}
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: node_modules/.cache/playwright
          if-no-files-found: ignore
          retention-days: 7

  # The only required check. It always runs, and passes when every job above
  # passed or was skipped on purpose by its lane.
  result:
    name: CI result
    if: always()
    needs: [changes, kit, lint, types, unit, build, worker, playwright, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped by its lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job ended with '$result'."; exit 1 ;;
            esac
          done
